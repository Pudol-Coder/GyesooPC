<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>계수중 PC방 좌석 예약</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a href="index.html" style="color:var(--text-dim); font-size:13px; text-decoration:none;">← 처음으로</a>
  <h1 class="title">계수중 PC방 좌석 예약</h1>
  <p class="subtitle">원하는 좌석을 눌러 예약하세요. 예약이 완료되면 입장 코드가 발급되고,<br>행사 당일 관리자가 학번 확인 후 코드를 안내해드립니다.</p>

  <div class="callout" id="closedBanner" style="display:none;">
    현재 예약이 마감되어 있어요. 관리자에게 문의해주세요.
  </div>

  <div class="legend">
    <span><i class="dot free"></i>빈 좌석</span>
    <span><i class="dot selected"></i>선택함</span>
    <span><i class="dot taken"></i>예약됨</span>
    <span id="seatCount" style="margin-left:auto; color:var(--accent); font-weight:700;"></span>
  </div>

  <div class="room" id="room">
    <div class="front-label">← 화면 / 교탁 방향</div>
    <div id="rows"></div>
  </div>

  <a href="admin.html" class="admin-link">관리자 페이지</a>
</div>

<div class="panel" id="panel">
  <div class="panel-inner">
    <div id="formView">
      <div class="panel-seat" id="panelSeatLabel"></div>
      <div class="field">
        <label for="studentId">학번 (5자리)</label>
        <input id="studentId" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="예: 20305" maxlength="5">
      </div>
      <div class="field">
        <label for="phone">전화번호</label>
        <input id="phone" type="tel" inputmode="numeric" placeholder="예: 01012345678" maxlength="11">
      </div>
      <div class="field">
        <label for="captchaAnswer" id="captchaLabel">사람 확인</label>
        <input id="captchaAnswer" type="text" inputmode="numeric" placeholder="계산 결과 입력">
      </div>
      <div class="error" id="errorMsg"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancelBtn">취소</button>
        <button class="btn btn-primary" id="submitBtn">예약하기 (30분)</button>
      </div>
    </div>
    <div id="resultView" style="display:none">
      <div class="result">
        <div class="panel-seat" id="resultSeatLabel"></div>
        <div class="result-note">예약이 완료되었습니다.<br>행사 당일 현장에서 학번 확인 후 관리자가 입장 코드를 안내해드립니다.</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="doneBtn">확인</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
