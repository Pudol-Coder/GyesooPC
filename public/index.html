<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>계수중 PC방</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="landing">
  <div class="landing-inner">
    <div class="landing-badge">GYESOO PC방</div>
    <h1 class="landing-title">계수중 PC방</h1>
    <p class="landing-sub">원하는 좌석을 예약하고, 행사 당일 바로 즐기세요.</p>

    <div class="landing-btns">
      <button class="btn btn-primary landing-btn" id="goReserve">예약하기</button>
      <button class="btn btn-outline landing-btn" id="toggleIntro">소개 보기</button>
      <a class="btn btn-outline landing-btn" href="http://gyesoo.icems.kr" target="_blank" rel="noopener">인천계수중학교 홈페이지</a>
    </div>

    <div class="intro-panel" id="introPanel">
      <h2>이런 행사예요</h2>
      <ul>
        <li>컴퓨터실 34개 좌석, 좌석당 30분 이용</li>
        <li>미리 원하는 좌석을 예약하면 나중에 입장 코드를 받아요</li>
        <li>당일 현장 예약도 가능해요</li>
        <li>행사 당일, 예약한 좌석 컴퓨터에서 코드를 입력하면 바로 이용 시작!</li>
      </ul>
    </div>
  </div>
</div>
<script src="landing.js"></script>
</body>
</html>
