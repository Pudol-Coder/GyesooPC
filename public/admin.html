<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 - 예약 현황</title>
<link rel="stylesheet" href="style.css">
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--text-dim); font-weight: 700; font-size: 12px; }
  .code-cell { color: var(--accent); font-weight: 700; letter-spacing: 0.1em; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .toolbar input { flex: 1; }
  .count { color: var(--text-dim); font-size: 13px; margin-top: 16px; }
  .delete-btn {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 3px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .delete-btn:hover { background: var(--danger); color: #fff; }
  .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .stats-bar {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
    margin: 16px 0;
  }
  .stats-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .stats-track { background: #0E1219; border-radius: 999px; height: 8px; overflow: hidden; }
  .stats-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s ease; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .toggle-switch {
    width: 44px; height: 24px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--seat-taken); position: relative; cursor: pointer; flex: none;
  }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    background: #fff; border-radius: 50%; transition: left 0.2s ease;
  }
  .toggle-switch.on::after { left: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">예약 현황 (관리자)</h1>
  <p class="subtitle">전체 예약 목록을 확인하고 JSON 파일로 내려받아 PC 관리 백엔드에 넣으세요.</p>

  <div class="field">
    <label for="adminKey">관리자 키</label>
    <div class="toolbar">
      <input id="adminKey" type="password" placeholder="ADMIN_KEY 입력">
      <button class="btn btn-primary" style="flex:0 0 auto; padding:11px 16px;" id="loadBtn">불러오기</button>
    </div>
  </div>

  <div class="error" id="errorMsg"></div>

  <div class="stats-bar">
    <div class="stats-top">
      <span id="statsText">예약 현황을 불러와주세요</span>
      <span id="statsPercent"></span>
    </div>
    <div class="stats-track"><div class="stats-fill" id="statsFill"></div></div>

    <div class="toggle-row">
      <span style="font-size:13px; color:var(--text-dim);">예약 접수 상태</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="reservationStatusText" style="font-size:13px; color:var(--text-dim);">확인 중...</span>
        <div class="toggle-switch" id="reservationToggle"></div>
      </div>
    </div>
  </div>

  <div class="count" id="count"></div>

  <div class="field" style="margin-top:12px;">
    <label for="searchBox">학번으로 찾기</label>
    <input id="searchBox" type="text" inputmode="numeric" placeholder="학번 입력">
  </div>

  <table id="table" style="display:none">
    <thead>
      <tr><th>좌석</th><th>학번</th><th>코드</th><th>예약시각</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="btn-row" style="max-width:240px; margin-top:20px;">
    <button class="btn btn-primary" id="downloadBtn" style="display:none">JSON 다운로드</button>
  </div>

  <div class="doc-divider" style="margin:40px 0;"></div>

  <h1 class="title" style="font-size:22px;">문의 목록</h1>
  <div class="count" id="iqCount" style="margin-top:0;"></div>
  <table id="iqTable" style="display:none">
    <thead>
      <tr><th>학번/이름</th><th>내용</th><th>시간</th><th></th></tr>
    </thead>
    <tbody id="iqTbody"></tbody>
  </table>
</div>
<script src="admin.js"></script>
</body>
</html>
